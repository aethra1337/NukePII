services:
  nukepii:
    build: .
    image: nukepii:latest
    ports:
      - "${NUKEPII_PORT:-5000}:5000"
    environment:
      NUKEPII_HOST: "0.0.0.0"
      NUKEPII_PORT: "5000"
      NUKEPII_ALLOW_RAW: "0"   # keep Safe Preview masked
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # PII never leaves the box: no volumes mounted by default.
    # To scan host files, mount read-only explicitly:
    # volumes:
    #   - ./samples:/data:ro
    restart: unless-stopped
