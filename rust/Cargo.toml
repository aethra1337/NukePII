[package]
name = "nukepii-native"
version = "0.3.0"
edition = "2021"
description = "NukePII native hot-path: checksums + Aho-Corasick prefilter (GIL-free)"
license = "MIT"

[lib]
name = "nukepii_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
aho-corasick = "1.1"
memchr = "2.7"
rayon = "1.10"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
