name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check nukepii
      - name: OpenAPI contract check
        run: |
          python -m nukepii.cli.main openapi --out /tmp/openapi.json
          python -c "import json; d=json.load(open('/tmp/openapi.json')); assert d['openapi'].startswith('3.1'), d.get('openapi'); assert '/api/v1/scan' in d['paths']; print('openapi paths:', len(d['paths']))"

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nukepii:ci .
